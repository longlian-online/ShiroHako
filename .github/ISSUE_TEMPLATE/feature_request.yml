name: 功能建议
description: 提出新功能想法或体验改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎分享你的想法！告诉我们你在团队协作与流程管理中的实际痛点，会让讨论更有针对性。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题？
      description: 描述你当前遇到的不便或缺少的协作能力。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      description: 描述你理想中的交互、流程或接口形式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充说明 / 参考示例
      description: 是否有其他工具的做法、截图或替代方案可供参考？
